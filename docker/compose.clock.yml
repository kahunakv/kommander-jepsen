# Overlay that grants nodes CAP_SYS_TIME, enabling the :clock nemesis.
#
#   docker compose -f compose.yml -f compose.clock.yml up -d --build
#
# ONLY on a disposable Linux host. settimeofday inside a container moves the
# shared kernel clock — on Docker Desktop that is the whole VM, and on a CI
# runner it breaks TLS validation and the job agent along with everything else.
#
# Note that on one host this does NOT produce skew between nodes: all
# containers share the kernel clock, so bumping one node bumps all five. For
# per-node skew of the hybrid logical clock, use `--faults skew`, which needs
# neither this overlay nor CAP_SYS_TIME (see src/kommander/nemesis/skew.clj).
# This overlay is only useful for whole-cluster clock jumps.

services:
  n1: &clock
    cap_add:
      - NET_ADMIN
      - SYS_TIME
  n2: *clock
  n3: *clock
  n4: *clock
  n5: *clock
